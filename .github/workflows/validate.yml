name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # "images" verlangt ein Bildschirmfoto im README. Das ist nur fuer die
          # Aufnahme in den offiziellen HACS-Store noetig, nicht fuer ein
          # benutzerdefiniertes Repository. Sobald ein echtes Bild der Karte
          # vorliegt, kommt es ins README und diese Zeile faellt weg.
          ignore: images
